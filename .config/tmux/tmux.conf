# -----------------------------------------------------------------------------
# Plugin List
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# -----------------------------------------------------------------------------
# Resurrect & Continuum
# -----------------------------------------------------------------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '120'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
set-option -g default-terminal "tmux-256color"

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g mouse on
set-option -g status-position top

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
source-file ~/.config/tmux/tokyonight_night.tmux

# -----------------------------------------------------------------------------
# Reload Config
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# -----------------------------------------------------------------------------
# Better splits
# -----------------------------------------------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Toggle zoom
bind z resize-pane -Z

# -----------------------------------------------------------------------------
# SessionX
# -----------------------------------------------------------------------------
set -g @sessionx-bind 's'

bind S command-prompt -p "Session name:" "new-session -s '%%'"
bind K confirm-before -p "Kill session? (y/n)" kill-session

# -----------------------------------------------------------------------------
# Disable conflicting tmux-resurrect bindings
# -----------------------------------------------------------------------------
unbind-key C-s

# -----------------------------------------------------------------------------
# TPM (must be last)
# -----------------------------------------------------------------------------
run-shell ~/.config/tmux/plugins/tpm/tpm
